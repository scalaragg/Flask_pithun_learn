<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Регистрация</title></head>
<body>
    <h1>Регистрация</h1>
    <form method="post" action="{{ url_for('register') }}">
        <input type="email" name="reg_email" placeholder="Электронная почта" required>
        <input type="password" name="reg_pass" placeholder="Создайте пароль" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    {% if error %}<p>{{ error }}</p>{% endif %}
    <p><a href="{{ url_for('login') }}">Уже есть аккаунт? Войти</a></p>
</body>
</html>
