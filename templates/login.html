<html>
    <head>
        <title>Авторизация</title>
    </head>
    <body>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label>Имя пользователя (admin) </label>
            <br>
            <input
                type="text"
                name="username"
                required
            >

            <br><br>

            <label>Пароль (12345)</label>
            <br>
            <input
                type="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">Войти</button>

        </form>

    </body>
</html>
