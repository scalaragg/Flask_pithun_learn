<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Вход</title></head>
<body>
    <h1>Вход</h1>
    <form method="post" action="{{ url_for('login') }}">
        <input type="email" name="log_name" placeholder="Электронная почта" required>
        <input type="password" name="log_pass" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    {% if error %}<p>{{ error }}</p>{% endif %}
    <p><a href="{{ url_for('register') }}">Регистрация</a></p>
</body>
</html>
