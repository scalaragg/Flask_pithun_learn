<html>
    <head>
        <title>Teachers</title>
    </head>
    <body>
        <h1>Преподаватели</h1>

        {% if error %}
            <p>Ошибка подключения к базе данных: {{ error }}</p>
        {% elif teachers %}
            <table border="1">
                <tr>
                    <th>ФИО</th>
                    <th>Телефон</th>
                </tr>
                {% for teacher in teachers %}
                <tr>
                    <td>{{ teacher[0] }}</td>
                    <td>{{ teacher[1] }}</td>
                </tr>
                {% endfor %}
            </table>
        {% else %}
            <p>Данные не найдены.</p>
        {% endif %}

        <p><a href="/">На главную</a></p>
    </body>
</html>
